<!--Se utiliza el extends para renderizar la base de la pagina en la nueva pagina-->
{% extends "base.html" %} {% block title %} Sign-Up {% endblock %}

<!--Se agrega un blocke de contenido y se le agrega un titulo-->
{% block content %}
    <form  method="POST">
        <h3 align = "center">Sign-Up</h3>
        
        <div class="form-floating m-3">
            <input 
            type="email" 
            class="form-control" 
            id="email"
            name="email"
            placeholder="Enter email"
            />        
            <label for="email">Email Address </label>
        </div>

        <div class="form-floating m-3">
            <input 
            type="text" 
            class="form-control" 
            id="firstName"
            name="firstName"
            placeholder="Enter First Name"
            />
            <label for="fistName"> First Name </label>
        </div>

        <div class="form-floating m-3">
            <input 
            type="password" 
            class="form-control" 
            id="password1"
            name="password1"
            placeholder="Enter Your Password"
            />
            <label for="password1"> Password </label>
        </div>

        <div class="form-floating m-3">
            <input 
            type="password" 
            class="form-control" 
            id="passwor2"
            name="password2"
            placeholder="Confirm Your Password"
            />
            <label for="password2"> Password (Confirm) </label>
        </div>
        <br/>
        <button type="submit" class="btn btn-primary"> Submit</button>

    </form>
{% endblock %}
